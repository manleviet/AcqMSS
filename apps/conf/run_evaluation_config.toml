# Evaluation Configuration
# Run with: PYTHONPATH=. python apps/run_evaluation.py apps/conf/run_evaluation_config.toml

[general]
seed = 82
output_dir = "data/results"
verbose = true

[evaluation]
# Evaluation strategies: "all" (both), "description", or "clause"
strategy = "all"

# Number of folds for cross-validation (0 = no CV)
n_folds = 5

# Solver settings
solver_name = "glucose4"

# Solver modes: "all" (both), "incremental", or "non-incremental"
solver_mode = "all"

# =============================================================================
# Models to evaluate
# Sampling strategies: rs_1n, rs_2n, rs_3n, rs_m, 2cov, ff
# =============================================================================

# =============================================================================
# REAL-FM-7 (14 features, 80 valid configs)
# =============================================================================
[[models]]
name = "REAL-FM-7_rs_1n"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
result = "data/results/REAL-FM-7_rs_1n_kb.json"
examples = "data/examples/REAL-FM-7_rs_1n.json"

