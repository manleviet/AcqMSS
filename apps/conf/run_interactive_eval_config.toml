# Interactive (QuAcq) Constraint Acquisition Configuration
#
# Usage:
#   PYTHONPATH=. python apps/run_interactive_eval.py apps/conf/run_interactive_eval_config.toml -v
#   PYTHONPATH=. python apps/run_interactive_eval.py apps/conf/run_interactive_eval_config.toml --interactive

[general]
seed = 82
output_dir = "data/results/interactive"
verbose = true

[interactive]
# Maximum number of membership queries
max_queries = 1000

# Mode: "automated" (Oracle answers using FM) or "interactive" (human expert)
mode = "automated"

# SAT solver name
solver_name = "glucose4"

# Cross-validation settings
n_folds = 0
shuffle_bias = true

# Query generation mode for example-based learning:
#   "example_only"  - only draw queries from example pool (stops when pool empty)
#   "example_first" - examples first, then SAT-generated queries from bias (up to max_queries)
query_mode = "example_only"

# Models to process
# Each model needs:
#   - oracle: Path to feature model (.uvl)
#   - bias: Path to bias file (.json)
# Optional per-model:
#   - name: Display name (defaults to FM file stem)
#   - examples: Path to examples file (.json) for CV
#   - folds_path: Path to pre-generated folds (.json) for CV

# =============================================================================
# REAL-FM-7 (14 features, 80 valid configs)
# =============================================================================
[[models]]
name = "REAL-FM-7_rs_1n"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
