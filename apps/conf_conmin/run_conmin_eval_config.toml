# ConMin comparison-condition CV evaluation (P4d)
# Run: python -m apps.run_conmin_eval apps/conf_conmin/run_conmin_eval_config.toml -v
# Stage heavy KBs: --kb REAL-FM-7   (then fqa, arcade-game, REAL-FM-4, busybox-1.18.0)

[general]
seed = 82                       # folds are pre-recorded in data/folds/ (not regenerated)
output_dir = "data/results_conmin"
verbose = true

[evaluation]
example_sets = ["2cov", "ff", "rs_1n", "rs_2n", "rs_3n", "rs_m"]
k_values = [1, 2, 3, 5]
negatives = ["reduced", "raw"]

# QuAcq-active (oracle-mode) condition — 5th column beside A/C/C∪S/QuAcq. Learned ONCE per KB
# (fold/example-independent). max_queries is the DETERMINISTIC rail; timeout_s a wall-clock
# SAFETY NET only (a timeout truncates non-reproducibly → reported non-converged). Size big KBs
# via the per-KB map so max_queries fires before the timeout (busybox |B|=6635; the query
# counter is shared with FindScope/FindC, so learned constraints ≪ budget).
quacq_active = true
quacq_active_max_queries = 5000
quacq_active_timeout_s = 400
quacq_active_max_queries_per_kb = { "busybox-1.18.0" = 20000 }

# QuAcq (passive) query mode: "example_only" (default) or "example_first". Lets us pick the
# reportable mode without a code edit; use with --conditions quacq to recompute just QuAcq.
quacq_query_mode = "example_only"

# The 5 eval KBs (brief §9e). example-set + folds paths are derived from `name`.
# ea2468 / linux excluded (scalability discussion only — brief §9e).
[[models]]
name = "REAL-FM-7"
oracle = "data/fms/REAL-FM-7.uvl"
bias = "data/bias/REAL-FM-7-bias.json"
examples = "data/examples/REAL-FM-7_rs_1n.json"

[[models]]
name = "fqa"
oracle = "data/fms/fqa.uvl"
bias = "data/bias/fqa-bias.json"
examples = "data/examples/fqa_rs_1n.json"

[[models]]
name = "arcade-game"
oracle = "data/fms/arcade-game.uvl"
bias = "data/bias/arcade-game-bias.json"
examples = "data/examples/arcade-game_rs_1n.json"

[[models]]
name = "REAL-FM-4"
oracle = "data/fms/REAL-FM-4.uvl"
bias = "data/bias/REAL-FM-4-bias.json"
examples = "data/examples/REAL-FM-4_rs_1n.json"

[[models]]
name = "busybox-1.18.0"
oracle = "data/fms/busybox-1.18.0.uvl"
bias = "data/bias/busybox-1.18.0-bias.json"
examples = "data/examples/busybox-1.18.0_rs_1n.json"
