[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acqmss"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flamapy-fw==2.6.0.dev4",
    "flamapy-fm==2.6.0.dev4",
    "flamapy-sat==2.6.0.dev4",
    "python-sat==0.1.8.dev17",
    "toml~=0.10.2",
    "allpairspy~=2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "parameterized~=0.9.0",
]

[tool.setuptools.packages.find]
# explanation and profiling both come from the canonical ../explanation package
# (pip install -e ../explanation), not bundled here.
include = ["conacq*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
