[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acqmss"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flamapy-fw==2.6.0.dev4",
    "flamapy-fm==2.6.0.dev4",
    "flamapy-sat==2.6.0.dev4",
    "python-sat==0.1.8.dev17",
    "toml~=0.10.2",
    "allpairspy~=2.5.1",
    # Required by conacq/bias/config_loader.py, which reads the YAML bias configurations in
    # data/bias-config/. It was missing from this list: the module hard-imports `yaml`, but a clean
    # environment never installed it, so `apps.run_conmin_eval` failed at import on any machine that
    # did not already happen to have PyYAML. Found 2026-08-01 when the AAAI supplementary bundle was
    # installed into a fresh venv — the first time this repo was ever built from nothing.
    "PyYAML~=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "parameterized~=0.9.0",
]

[tool.setuptools.packages.find]
# explanation and profiling both come from the canonical ../explanation package
# (pip install -e ../explanation), not bundled here.
include = ["conacq*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
